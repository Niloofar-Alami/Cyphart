<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYPHART // Threat Telemetry & Neural Matrix</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="cyber-grid-bg"></div>

    <div class="terminal-shell">
      <header class="console-header">
        <div class="sys-status">
          <span class="pulse-beacon"></span>
          <span class="sys-title">CYPHART // CORE_V4.2</span>
        </div>
        <div class="sys-metrics">
          <span>SECURE_LINK: ACTIVE</span>
          <span>LATENCY: 14MS</span>
        </div>
      </header>

      <main class="dashboard-grid">
        <section class="panel node-matrix-panel">
          <div class="panel-header">
            <h2>Neural Network Nodes</h2>
            <span class="tag">ACTIVE_TOPOLOGY</span>
          </div>

          <div class="nodes-list">
            <label class="node-item">
              <input type="radio" name="node-select" checked />
              <div class="node-content">
                <div class="node-info">
                  <span class="node-id">NODE_01 // ALPHA</span>
                  <span class="node-status">Synchronized</span>
                </div>
                <div class="load-bar">
                  <div class="fill" style="width: 84%"></div>
                </div>
              </div>
            </label>

            <label class="node-item">
              <input type="radio" name="node-select" />
              <div class="node-content">
                <div class="node-info">
                  <span class="node-id">NODE_02 // BETA</span>
                  <span class="node-status">Analyzing Flow</span>
                </div>
                <div class="load-bar">
                  <div class="fill" style="width: 62%"></div>
                </div>
              </div>
            </label>

            <label class="node-item">
              <input type="radio" name="node-select" />
              <div class="node-content">
                <div class="node-info">
                  <span class="node-id">NODE_03 // GAMMA</span>
                  <span class="node-status">Secured Bridge</span>
                </div>
                <div class="load-bar">
                  <div class="fill" style="width: 91%"></div>
                </div>
              </div>
            </label>
          </div>

          <!-- Explore Repository Button -->
          <a
            href="https://github.com/Niloofar-Alami/Cyphart/tree/main"
            target="_blank"
            rel="noopener noreferrer"
            class="explore-btn"
          >
            <span>EXPLORE REPOSITORY</span>
            <span class="arrow">→</span>
          </a>
        </section>

        <section class="panel telemetry-panel">
          <div class="panel-header">
            <h2>Telemetry Stream</h2>
            <span class="tag">REAL_TIME</span>
          </div>

          <div class="terminal-screen">
            <p class="log-entry">
              [00:00:01] System initialized via secure kernel stream.
            </p>
            <p class="log-entry">
              [00:00:04] Establishing encrypted tunnel across matrix nodes...
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
